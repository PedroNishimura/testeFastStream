volumes:
  kafka_data:
    name: "stream-app-kafka-data"
    external: true

networks:
  app-tier:
    external: true
    driver: bridge
services:
  kafka:
    image: 'bitnami/kafka:3.7.1-debian-12-r0'
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    volumes:
      - "kafka_data:/bitnami"
    networks:
      - app-tier
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      start_period: 10s
      interval: 5s
      timeout: 10s
      retries: 5
    environment:
      # KRaft settings
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      # Listeners
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT


  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    networks:
      - app-tier
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CLUSTERS_0_NAME: r4zt_wrqTRuT7W2NJsB_GA
      LOGGING_LEVEL_ROOT: 'WARN'
    depends_on:
      - kafka

  faststream-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faststream-app
    ports:
      - "8000:8000"
    environment:
      KAFKA_BROKER_URL: kafka:9092  # Acessando Kafka pelo nome do serviço
    depends_on:
      kafka:
        condition: service_healthy  # Aguarda Kafka estar pronto antes de subir o FastStream
    networks:
      - app-tier